title: Onboard in OSMH
description: Deploy scheduled tag-based OS Management Hub onboarding in your OCI tenancy.
schemaVersion: 1.1.0
version: "1.2"
locale: en
informationalText: The stack deploys in the current OCI Console region. Use the Console region menu to select one of the tenancy's subscribed regions before opening this form. Apply opts in the selected instances and starts onboarding. Daily runs reconcile tagged instances.
variableGroups:
  - title: Compartment and Compute selection
    variables: ['${compartment_ocid}', '${selected_instance_ids}']
  - title: Function application and networking
    variables: ['${create_function_application}', '${application_id}', '${create_network}', '${existing_vcn_id}', '${existing_subnet_id}']
  - title: Daily schedule
    variables: ['${schedule_enabled}', '${schedule_time_utc}']
  - title: Function build authentication
    variables: ['${source_commit}', '${github_token_secret_id}']
  - title: Instance opt in and access
    variables: ['${tag_namespace}', '${use_existing_tag_namespace}', '${existing_tag_namespace_id}', '${create_instance_iam}']
  - title: Advanced operations
    variables: ['${workload_regions}', '${repository_families}', '${group_prefix}', '${logging_enabled}', '${invoke_after_deploy}', '${iam_wait_seconds}']
  - title: Console context
    visible: false
    variables: ['${tenancy_ocid}', '${region}', '${console_region}', '${selected_instance_id}', '${subnet_ids}', '${build_function_image}', '${source_repository_url}', '${source_branch}', '${build_revision}', '${existing_image}']
variables:
  tenancy_ocid:
    type: string
    visible: false
  console_region:
    type: string
    default: ${session.region}
    visible: false
  region:
    type: oci:identity:region:name
    default: ${session.region}
    visible: false
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Deployment and onboarding compartment
    required: true
    description: Deploy resources here and scan this compartment and its descendants. Select a dedicated scope that no other deployment manages.
  selected_instance_ids:
    type: list
    valueType: selected_instance_id
    title: Compute instances to onboard
    description: Select one or more RUNNING supported non-OKE instances from the chosen compartment. The scheduled worker scans this compartment and its descendants for instances opted in later. Removing a selection does not remove its opt-in tag.
    required: true
  selected_instance_id:
    type: oci:core:instance:id
    title: Compute instance
    visible: false
    dependsOn:
      compartmentId: ${compartment_ocid}
  workload_regions:
    type: string
    title: Workload regions
    description: Leave empty for the selected deployment region, enter comma-separated region names without spaces, or enter all.
  build_function_image:
    type: boolean
    default: true
    visible: false
  source_repository_url:
    type: string
    default: https://github.com/gautamm2707/osmh_onboarding.git
    visible: false
  source_branch:
    type: string
    default: main
    visible: false
  source_commit:
    type: string
    title: Published source commit SHA
    description: Full 40-character commit from this repository. Pinning the build ensures the deployed Function matches the reviewed stack source. Use the commit shown on the published blog page.
    required: true
  github_token_secret_id:
    type: oci:kms:secret:id
    title: GitHub access token secret
    description: "Select an OCI Vault secret containing a GitHub PAT that can read the source repository. OCI DevOps receives only the secret OCID. An OCIR AUTH_TOKEN is not used: DevOps delivers the image and OCI Functions pulls it using IAM."
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
  build_revision:
    type: string
    default: "1"
    visible: false
  existing_image:
    type: string
    default: ""
    visible: false
  create_function_application:
    type: boolean
    title: Create a new Function application
    description: Clear to reuse an existing application in the selected compartment and region.
    default: true
  application_id:
    type: string
    title: Existing Function application OCID
    description: Resource Manager has no native Function application dropdown. Copy the OCID of an ACTIVE GENERIC_X86 application in the selected compartment and region.
    required: true
    visible:
      not: ['${create_function_application}']
  create_network:
    type: boolean
    title: Create a new VCN and subnet
    description: Creates a private regional subnet, NAT gateway, routes and security rules using 10.254.0.0/24. Clear to choose existing networking.
    default: true
    visible: ${create_function_application}
  existing_vcn_id:
    type: oci:core:vcn:id
    title: Existing VCN
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible:
      and:
        - ${create_function_application}
        - not: ['${create_network}']
  existing_subnet_id:
    type: oci:core:subnet:id
    title: Existing regional subnet
    description: Must have outbound HTTPS and DNS connectivity for the Function.
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${existing_vcn_id}
      hideAdSubnet: true
    visible:
      and:
        - ${create_function_application}
        - not: ['${create_network}']
  subnet_ids:
    type: array
    items:
      type: string
    visible: false
  tag_namespace:
    type: string
    title: Defined tag namespace
    default: OSMH
  use_existing_tag_namespace:
    type: boolean
    title: Reuse an existing namespace and managedby key
    default: false
    description: Enable if this namespace already exists anywhere in the tenancy. Existing tags are read without taking ownership.
  existing_tag_namespace_id:
    type: string
    title: Existing tag namespace OCID
    required: true
    visible: ${use_existing_tag_namespace}
  create_instance_iam:
    type: boolean
    title: Create instance dynamic group and OSMH policy
    default: true
    description: Disable only when equivalent instance permissions already exist. The Function always runs with IAM changes disabled.
  repository_families:
    type: string
    title: Additional Oracle repository families
    default: uek,ksplice,mysql,oci
  group_prefix:
    type: string
    title: OSMH group name prefix
    default: osmh
  schedule_enabled:
    type: boolean
    title: Enable daily reconciliation
    default: true
  schedule_time_utc:
    type: enum
    title: Daily start time (UTC)
    description: 24-hour clock, in 15-minute intervals. 16:30 UTC is 22:00 IST.
    default: "16:30"
