[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osmh-utility"
version = "1.0.0"
description = "Interactive OCI OS Management Hub onboarding and scheduled Function deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["oci>=2.185.1,<3"]

[project.scripts]
osmh-onboard = "osmh_utility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["osmh_utility", "osmh_utility.runtime", "osmh_utility.runtime.function", "osmh_utility.runtime.deployment"]
namespaces = true

[tool.setuptools.package-data]
osmh_utility = [
  "runtime/*.py", "runtime/requirements.txt", "runtime/.dockerignore",
  "runtime/function/Dockerfile", "runtime/function/*.py", "runtime/function/requirements.txt",
  "runtime/deployment/*.tf", "runtime/deployment/.terraform.lock.hcl",
]
